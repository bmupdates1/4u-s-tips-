
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4U'S TIPS | Admin Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071b13;
      color: white;
    }
    header {
      background: #103b29;
      padding: 22px;
      border-bottom: 2px solid #d4af37;
    }
    header h1 { margin: 0; color: #d4af37; }
    main { padding: 20px; max-width: 1000px; margin: auto; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
    }
    .card, .panel {
      background: #123c2b;
      padding: 20px;
      border: 1px solid #b99732;
      border-radius: 12px;
      margin-bottom: 15px;
    }
    .card h2 { color: #d4af37; font-size: 25px; }
    input {
      display: block;
      width: 100%;
      padding: 13px;
      margin: 12px 0;
      border-radius: 7px;
      border: 1px solid #d4af37;
    }
    button {
      background: #d4af37;
      color: #071b13;
      border: 0;
      padding: 10px 14px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
      margin: 4px;
    }
    #dashboard { display: none; }
    #message, #dashboardMessage, #usersMessage {
      color: #ffd76a;
    }
    .user {
      background: #071b13;
      border: 1px solid #b99732;
      border-radius: 8px;
      padding: 14px;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }
    .user p { margin: 7px 0; }
    .role { color: #d4af37; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>4U'S TIPS</h1>
    <p>PREDICT SMARTER | SUPER ADMIN</p>
  </header>

  <main>
    <section id="login" class="panel">
      <h2>Super Admin Login</h2>
      <input id="username" placeholder="Username">
      <input id="password" type="password" placeholder="Password">
      <button onclick="loginAdmin()">Login</button>
      <p id="message"></p>
    </section>

    <section id="dashboard">
      <h2>Admin Dashboard</h2>

      <div class="cards">
        <div class="card">
          <p>Total Users</p>
          <h2 id="totalUsers">...</h2>
        </div>
        <div class="card">
          <p>Total Tipsters</p>
          <h2 id="totalTipsters">...</h2>
        </div>
        <div class="card">
          <p>Total Tips</p>
          <h2 id="totalTips">...</h2>
        </div>
        <div class="card">
          <p>Premium Tips</p>
          <h2 id="premiumTips">...</h2>
        </div>
      </div>

      <div class="panel">
        <h2>Manage Users</h2>
        <p>View users and manage their roles.</p>
        <button onclick="loadUsers()">Refresh Users</button>
        <p id="usersMessage"></p>
        <div id="usersList"></div>
      </div>

      <div class="panel">
        <h2>Welcome, Super Admin</h2>
        <button onclick="loadDashboard()">Refresh Data</button>
        <button onclick="logout()">Logout</button>
      </div>
      <p id="dashboardMessage"></p>
    </section>
  </main>

  <script>
    const API = "https://fouru-s-tips.onrender.com";
    let adminToken = "";

    async function getData(path) {
      const response = await fetch(API + path, {
        headers: {
          "Authorization": "Bearer " + adminToken
        }
      });
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error || "Imeshindikana kupata taarifa.");
      }
      return data;
    }

    async function loginAdmin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");
      message.textContent = "Inaingia...";

      try {
        const response = await fetch(API + "/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const data = await response.json();

        if (!response.ok) throw new Error(data.error || "Login imeshindikana.");

        adminToken = data.token;
        const me = await getData("/api/auth/me");

        if (me.user?.role !== "SUPER_ADMIN" && me.role !== "SUPER_ADMIN") {
          throw new Error("Super Admin pekee anaruhusiwa.");
        }

        document.getElementById("login").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        await loadDashboard();
        await loadUsers();
      } catch (error) {
        adminToken = "";
        message.textContent = error.message;
      }
    }

    async function loadDashboard() {
      const status = document.getElementById("dashboardMessage");
      status.textContent = "Inapakia taarifa...";

      try {
        const [usersData, tipstersData, tipsData] = await Promise.all([
          getData("/api/users"),
          getData("/api/tipsters"),
          getData("/api/tips")
        ]);

        const users = usersData.users || [];
        const tipsters = tipstersData.tipsters || [];
        const tips = tipsData.tips || [];

        document.getElementById("totalUsers").textContent = users.length;
        document.getElementById("totalTipsters").textContent = tipsters.length;
        document.getElementById("totalTips").textContent = tips.length;
        document.getElementById("premiumTips").textContent =
          tips.filter(tip => tip.category === "PREMIUM").length;

        status.textContent = "Taarifa zimepatikana.";
      } catch (error) {
        status.textContent = error.message;
      }
    }

    async function loadUsers() {
      const list = document.getElementById("usersList");
      const status = document.getElementById("usersMessage");
      status.textContent = "Inapakia users...";
      list.replaceChildren();

      try {
        const data = await getData("/api/users");
        const users = data.users || [];

        if (users.length === 0) {
          status.textContent = "Hakuna users.";
          return;
        }

        status.textContent = "Jumla ya users: " + users.length;

        users.forEach(user => {
          const card = document.createElement("div");
          card.className = "user";

          const name = document.createElement("p");
          name.textContent = "Username: " + user.username;

          const email = document.createElement("p");
          email.textContent = "Email: " + user.email;

          const role = document.createElement("p");
          role.className = "role";
          role.textContent = "Role: " + user.role;

          card.append(name, email, role);

          if (user.role !== "SUPER_ADMIN") {
            const button = document.createElement("button");
            const promote = user.role === "CUSTOMER";
            button.textContent = promote ? "Promote to TIPSTER" : "Make CUSTOMER";

            button.onclick = () => changeRole(
              user.id,
              promote ? "TIPSTER" : "CUSTOMER"
            );

            card.appendChild(button);
          }

          list.appendChild(card);
        });
      } catch (error) {
        status.textContent = error.message;
      }
    }

    async function changeRole(userId, role) {
      if (!confirm("Una uhakika unataka kubadilisha role kuwa " + role + "?")) {
        return;
      }

      const status = document.getElementById("usersMessage");
      status.textContent = "Inabadilisha role...";

      try {
        const response = await fetch(API + "/api/users/" +
          encodeURIComponent(userId) + "/role", {
          method: "PATCH",
          headers: {
            "Authorization": "Bearer " + adminToken,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ role })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Role haijabadilika.");

        status.textContent = "Role imebadilika kikamilifu.";
        await loadUsers();
        await loadDashboard();
      } catch (error) {
        status.textContent = error.message;
      }
    }

    function logout() {
      adminToken = "";
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("login").style.display = "block";
      document.getElementById("password").value = "";
      document.getElementById("message").textContent = "";
      document.getElementById("usersList").replaceChildren();
    }
  </script>
</body>
</html>
