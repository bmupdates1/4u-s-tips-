<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4U'S TIPS Admin</title>
<style>
:root {
  --green:#063b2b;
  --gold:#d4af37;
  --bg:#071b15;
  --card:#102a21;
  --white:#fff;
  --muted:#b8c8bf;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--white);
  font-family:Arial,sans-serif;
}
header {
  background:var(--green);
  border-bottom:2px solid var(--gold);
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
}
header h1 { color:var(--gold); margin:0; }
header p { color:var(--muted); margin:5px 0 0; }
main { max-width:1100px; margin:auto; padding:18px; }
.panel {
  background:var(--card);
  border:1px solid #315644;
  border-radius:12px;
  padding:16px;
  margin-bottom:18px;
}
h2 { color:var(--gold); margin-top:0; }
input,select,button {
  width:100%;
  padding:12px;
  margin:7px 0;
  border-radius:7px;
  font-size:15px;
}
input,select {
  border:1px solid #527363;
  background:#fff;
  color:#111;
}
button {
  border:0;
  background:var(--gold);
  color:#17251d;
  font-weight:bold;
  cursor:pointer;
}
button.secondary {
  background:var(--green);
  color:#fff;
  border:1px solid var(--gold);
}
button.danger { background:#bd3939; color:#fff; }
.hidden { display:none !important; }
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px;
}
.stat {
  background:var(--green);
  border:1px solid var(--gold);
  border-radius:9px;
  padding:14px;
  text-align:center;
}
.stat strong {
  display:block;
  font-size:27px;
  color:var(--gold);
  margin-top:8px;
}
.item {
  background:#0b2119;
  border:1px solid #315644;
  border-radius:9px;
  padding:13px;
  margin:10px 0;
  overflow-wrap:anywhere;
}
.item small { color:var(--muted); }
.teams {
  display:flex;
  align-items:center;
  justify-content:space-around;
  gap:10px;
  text-align:center;
}
.teams div { flex:1; }
.teams img {
  width:38px;
  height:38px;
  object-fit:contain;
}
label {
  display:block;
  color:var(--muted);
  margin-top:10px;
}
.message { color:var(--gold); min-height:20px; }
.top-actions { display:flex; gap:8px; }
.top-actions button { width:auto; }
</style>
</head>

<body>
<header>
  <div>
    <h1>4U'S TIPS</h1>
    <p>PREDICT SMARTER — ADMIN PANEL</p>
  </div>
  <button id="logoutBtn" class="danger hidden" onclick="logout()">Logout</button>
</header>

<main>
  <section id="loginPanel" class="panel">
    <h2>Super Admin Login</h2>
    <label>Username</label>
    <input id="username" placeholder="Enter username" autocomplete="username">
    <label>Password</label>
    <input id="password" type="password" placeholder="Enter password" autocomplete="current-password">
    <button onclick="loginAdmin()">Login</button>
    <p id="loginMessage" class="message"></p>
  </section>

  <section id="dashboard" class="hidden">
    <div class="panel">
      <h2>Dashboard Overview</h2>
      <div class="grid">
        <div class="stat">Users<strong id="usersCount">0</strong></div>
        <div class="stat">Tipsters<strong id="tipstersCount">0</strong></div>
        <div class="stat">All Tips<strong id="tipsCount">0</strong></div>
        <div class="stat">Premium Tips<strong id="premiumCount">0</strong></div>
      </div>
      <button class="secondary" onclick="refreshDashboard()">Refresh Dashboard</button>
      <p id="dashboardMessage" class="message"></p>
    </div>

    <div class="panel">
      <h2>Manage Users</h2>
      <div id="usersList">Loading users...</div>
    </div>

    <div class="panel">
      <h2>Choose a Match</h2>
      <p>Select a fixture below to fill the publishing form.</p>
      <button class="secondary" onclick="loadFixtures()">Refresh Fixtures</button>
      <p id="fixturesMessage" class="message"></p>
      <div id="fixturesList">Loading fixtures...</div>
    </div>

    <div class="panel" id="publishPanel">
      <h2>Publish a Tip</h2>

      <label>Match</label>
      <input id="matchName" placeholder="Example: Arsenal vs Chelsea">

      <label>Prediction</label>
      <input id="prediction" placeholder="Example: Arsenal to win">

      <label>Odds (optional)</label>
      <input id="odds" type="number" min="0.01" step="0.01" placeholder="Example: 1.85">

      <label>Tip Category</label>
      <select id="category">
        <option value="FREE">FREE</option>
        <option value="PREMIUM">PREMIUM</option>
      </select>

      <input id="kickoffAt" type="hidden">

      <button onclick="publishTip()">Publish Tip</button>
      <p id="publishMessage" class="message"></p>
    </div>

    <div class="panel">
      <h2>Published Tips</h2>
      <button class="secondary" onclick="loadTips()">Refresh Tips</button>
      <div id="tipsList">Loading tips...</div>
    </div>
  </section>
</main>

<script>
const API = window.location.origin;
let adminToken = "";

async function requestJSON(path, options = {}) {
  const response = await fetch(API + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(adminToken ? { "Authorization": "Bearer " + adminToken } : {}),
      ...(options.headers || {})
    }
  });

  const contentType = response.headers.get("content-type") || "";
  let data = {};

  if (contentType.includes("application/json")) {
    data = await response.json();
  } else {
    throw new Error("Server haikurudisha majibu ya JSON.");
  }

  if (!response.ok) {
    throw new Error(data.error || "Request failed: " + response.status);
  }

  return data;
}

async function loginAdmin() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const message = document.getElementById("loginMessage");

  message.textContent = "Ingia kwenye akaunti...";

  try {
    const result = await requestJSON("/api/auth/login", {
      method: "POST",
      body: JSON.stringify({ username, password })
    });

    adminToken = result.token;

    const me = await requestJSON("/api/auth/me");

    if (me.user.role !== "SUPER_ADMIN") {
      adminToken = "";
      throw new Error("Akaunti hii si ya Super Admin.");
    }

    document.getElementById("loginPanel").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    document.getElementById("logoutBtn").classList.remove("hidden");

    await refreshDashboard();
  } catch (error) {
    message.textContent = error.message;
  }
}

function logout() {
  adminToken = "";
  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("logoutBtn").classList.add("hidden");
  document.getElementById("loginPanel").classList.remove("hidden");
  document.getElementById("password").value = "";
  document.getElementById("loginMessage").textContent = "Umetoka kwenye akaunti.";
}

async function refreshDashboard() {
  document.getElementById("dashboardMessage").textContent = "Inapakia...";

  try {
    await Promise.all([loadUsers(), loadTips(), loadTipsters()]);
    await loadFixtures();
    document.getElementById("dashboardMessage").textContent = "Dashboard imesasishwa.";
  } catch (error) {
    document.getElementById("dashboardMessage").textContent = error.message;
  }
}

async function loadUsers() {
  const result = await requestJSON("/api/users");
  const users = result.users || [];

  document.getElementById("usersCount").textContent = users.length;

  const list = document.getElementById("usersList");
  list.innerHTML = "";

  if (!users.length) {
    list.textContent = "Hakuna users bado.";
    return;
  }

  users.forEach(user => {
    const item = document.createElement("div");
    item.className = "item";

    const title = document.createElement("strong");
    title.textContent = user.username;

    const details = document.createElement("p");
    details.textContent = "Role: " + user.role + " | ID: " + user.id;

    item.append(title, details);

    if (user.role !== "SUPER_ADMIN") {
      const select = document.createElement("select");

      ["CUSTOMER", "TIPSTER"].forEach(role => {
        const option = document.createElement("option");
        option.value = role;
        option.textContent = role;
        if (user.role === role) option.selected = true;
        select.appendChild(option);
      });

      const save = document.createElement("button");
      save.textContent = "Update Role";
      save.onclick = () => changeRole(user.id, select.value);

      item.append(select, save);
    }

    list.appendChild(item);
  });
}

async function changeRole(userId, role) {
  if (!confirm("Unataka kubadilisha role ya huyu user?")) return;

  try {
    await requestJSON("/api/users/" + encodeURIComponent(userId) + "/role", {
      method: "PATCH",
      body: JSON.stringify({ role })
    });
    alert("Role imebadilishwa.");
    await loadUsers();
    await loadTipsters();
  } catch (error) {
    alert(error.message);
  }
}

async function loadTipsters() {
  const result = await requestJSON("/api/tipsters");
  document.getElementById("tipstersCount").textContent =
    (result.tipsters || []).length;
}

async function loadTips() {
  const result = await requestJSON("/api/tips");
  const tips = result.tips || [];

  document.getElementById("tipsCount").textContent = tips.length;
  document.getElementById("premiumCount").textContent =
    tips.filter(tip => tip.category === "PREMIUM").length;

  const list = document.getElementById("tipsList");
  list.innerHTML = "";

  if (!tips.length) {
    list.textContent = "Hakuna tips zilizochapishwa.";
    return;
  }

  tips.forEach(tip => {
    const item = document.createElement("div");
    item.className = "item";

    const match = document.createElement("strong");
    match.textContent = tip.matchName;

    const prediction = document.createElement("p");
    prediction.textContent = "Prediction: " + tip.prediction;

    const info = document.createElement("small");
    info.textContent =
      "Category: " + tip.category +
      " | Result: " + tip.result +
      " | Odds: " + (tip.odds ?? "Not set");

    item.append(match, prediction, info);
    list.appendChild(item);
  });
}

async function loadFixtures() {
  const list = document.getElementById("fixturesList");
  const message = document.getElementById("fixturesMessage");

  list.textContent = "Loading fixtures...";
  message.textContent = "";

  try {
    const result = await requestJSON("/api/football/next");
    const fixtures = result.fixtures || result.response || [];

    list.innerHTML = "";

    if (!fixtures.length) {
      list.textContent = "Hakuna fixtures zilizopatikana.";
      return;
    }

    fixtures.forEach(item => {
      const fixture = item.fixture || {};
      const teams = item.teams || {};
      const league = item.league || {};
      const home = teams.home || {};
      const away = teams.away || {};

      const card = document.createElement("div");
      card.className = "item";

      const leagueText = document.createElement("small");
      leagueText.textContent =
        (league.name || "Football") + " — " + (league.country || "");

      const teamRow = document.createElement("div");
      teamRow.className = "teams";

      const homeBox = document.createElement("div");
      const homeLogo = document.createElement("img");
      homeLogo.src = home.logo || "";
      homeLogo.alt = "";
      const homeName = document.createElement("p");
      homeName.textContent = home.name || "Home";
      homeBox.append(homeLogo, homeName);

      const vs = document.createElement("strong");
      vs.textContent = "VS";

      const awayBox = document.createElement("div");
      const awayLogo = document.createElement("img");
      awayLogo.src = away.logo || "";
      awayLogo.alt = "";
      const awayName = document.createElement("p");
      awayName.textContent = away.name || "Away";
      awayBox.append(awayLogo, awayName);

      teamRow.append(homeBox, vs, awayBox);

      const date = document.createElement("small");
      date.textContent = fixture.date
        ? new Date(fixture.date).toLocaleString()
        : "Kickoff time unavailable";

      const choose = document.createElement("button");
      choose.textContent = "Choose This Match";
      choose.onclick = () => chooseFixture(
        home.name || "Home",
        away.name || "Away",
        fixture.date || ""
      );

      card.append(leagueText, teamRow, date, choose);
      list.appendChild(card);
    });
  } catch (error) {
    list.textContent = "Could not load fixtures.";
    message.textContent = error.message;
  }
}

function chooseFixture(home, away, kickoff) {
  document.getElementById("matchName").value = home + " vs " + away;
  document.getElementById("kickoffAt").value = kickoff
    ? new Date(kickoff).toISOString()
    : "";

  document.getElementById("publishPanel").scrollIntoView({
    behavior: "smooth"
  });

  document.getElementById("publishMessage").textContent =
    "Match imechaguliwa. Weka prediction kisha publish.";
}

async function publishTip() {
  const matchName = document.getElementById("matchName").value.trim();
  const prediction = document.getElementById("prediction").value.trim();
  const oddsText = document.getElementById("odds").value.trim();
  const category = document.getElementById("category").value;
  const kickoffAt = document.getElementById("kickoffAt").value;

  const message = document.getElementById("publishMessage");

  if (!matchName || !prediction) {
    message.textContent = "Jaza Match na Prediction kwanza.";
    return;
  }

  const body = {
    matchName,
    prediction,
    category
  };

  if (oddsText) {
    body.odds = Number(oddsText);
  }

  if (kickoffAt) {
    body.kickoffAt = kickoffAt;
  }

  message.textContent = "Inachapisha tip...";

  try {
    await requestJSON("/api/tips", {
      method: "POST",
      body: JSON.stringify(body)
    });

    message.textContent = "Tip imechapishwa kikamilifu.";

    document.getElementById("matchName").value = "";
    document.getElementById("prediction").value = "";
    document.getElementById("odds").value = "";
    document.getElementById("category").value = "FREE";
    document.getElementById("kickoffAt").value = "";

    await loadTips();
  } catch (error) {
    message.textContent = error.message;
  }
}
</script>
</body>
</html>
