
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tipster Profile | 4U'S TIPS</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#071b15;color:white}
header{background:#063b2b;border-bottom:2px solid #d4af37;padding:18px;text-align:center}
h1,h2,h3{color:#d4af37}
main{max-width:650px;margin:auto;padding:18px}
.panel{background:#102a21;border:1px solid #315644;border-radius:12px;padding:18px;margin-bottom:18px}
button{width:100%;padding:13px;margin:7px 0;border-radius:7px;font-size:15px;border:0;background:#d4af37;color:#102a21;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.secondary{background:#063b2b;color:white;border:1px solid #d4af37}
.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid #d4af37}
.profile{text-align:center}
.stats{color:#d4af37}
.slip{background:#071b15;border:1px solid #315644;border-radius:9px;padding:13px;margin:10px 0}
.message{color:#d4af37}
.locked{border:1px solid #d4af37;background:#18251e}
.lock-label{color:#d4af37;font-weight:bold}
.premium-title{color:#d4af37}
.free-title{color:#35d39a}
.code{background:#063b2b;padding:9px;border-radius:6px;margin:7px 0;overflow-wrap:anywhere}
.code strong{color:#35d39a}
.status{font-weight:bold;color:#35d39a}
.lock-status{font-weight:bold;color:#ff7777}
.small{font-size:13px;color:#bbb}
</style>
</head>

<body>

<header>
<h1>4U'S TIPS</h1>
<p>PREDICT SMARTER</p>
</header>

<main>

<div class="panel">
<button class="secondary" onclick="goBack()">← Back to Tipsters</button>
</div>

<div class="panel profile" id="profile">
<p class="message">Loading Tipster profile...</p>
</div>

<!-- FREE BOOKING CODES -->
<div class="panel">
<h2 class="free-title">FREE BOOKING CODES</h2>
<div id="freeBookingCodes">Loading FREE booking codes...</div>
</div>

<!-- PREMIUM TIPS -->
<div class="panel">
<h2 class="premium-title">PREMIUM TIPS 🔒</h2>
<div id="premiumTips">Loading PREMIUM tips...</div>
</div>

</main>

<script>
const API=window.location.origin;
const params=new URLSearchParams(window.location.search);
const tipsterId=params.get("id");

let token="";

async function request(path){

 const response=await fetch(API+path,{
  headers:{
   "Authorization":"Bearer "+token
  }
 });

 let data={};

 try{
  data=await response.json();
 }catch{
  throw new Error("Server response haijasomeka.");
 }

 if(!response.ok){
  throw new Error(data.error||"Request failed");
 }

 return data;
}

function goBack(){
 window.location.href="index.html";
}

function showError(message){

 document.getElementById("profile").textContent=message;

 document.getElementById("freeBookingCodes").textContent=message;

 document.getElementById("premiumTips").textContent=message;

}

/* PROFILE INFORMATION */

async function loadProfile(){

 try{

  if(!tipsterId){
   throw new Error("Tipster ID haipo kwenye link.");
  }

  const savedToken=sessionStorage.getItem("4u_customer_token");

  if(!savedToken){
   throw new Error("Tafadhali login kwanza kupitia Customer Website.");
  }

  token=savedToken;

  const me=await request("/api/auth/me");

  if(me.user.role!=="CUSTOMER"){
   throw new Error("Tumia akaunti ya Customer.");
  }

  const result=await request(
   "/api/tipsters/"+encodeURIComponent(tipsterId)
  );

  const t=result.tipster;

  if(!t){
   throw new Error("Tipster profile haijapatikana.");
  }

  const profile=document.getElementById("profile");

  profile.innerHTML="";

  const img=document.createElement("img");
  img.className="avatar";

  img.src=t.profileImage||
   "https://placehold.co/120x120/063b2b/d4af37?text=4U";

  img.onerror=()=>{
   img.src="https://placehold.co/120x120/063b2b/d4af37?text=4U";
  };

  const name=document.createElement("h2");
  name.textContent=t.username;

  const followers=document.createElement("p");
  followers.className="stats";
  followers.textContent="Followers: "+t.followers;

  const accuracy=document.createElement("h3");
  accuracy.textContent="Winning Accuracy: "+t.accuracy+"%";

  const record=document.createElement("p");
  record.textContent="Wins: "+t.wins+" | Losses: "+t.losses;

  const follow=document.createElement("button");
  follow.textContent=t.isFollowing?"Unfollow":"Follow";
  follow.onclick=()=>changeFollow(t.isFollowing);

  profile.append(
   img,
   name,
   followers,
   accuracy,
   record,
   follow
  );

  /* LOAD FREE BOOKING CODES AND PREMIUM TIPS */

  await loadFreeBookingCodes();
  showPremiumTips(t.tips||[]);

 }catch(error){

  showError(error.message);

 }

}

/* FREE BOOKING CODES */

async function loadFreeBookingCodes(){

 const list=document.getElementById("freeBookingCodes");

 list.textContent="Loading FREE booking codes...";

 try{

  const result=await request("/api/slips");

  const slips=(result.slips||[]).filter(slip=>
   slip.tipsterId===tipsterId&&
   slip.category==="FREE"&&
   slip.isPublished===true
  );

  list.innerHTML="";

  if(!slips.length){

   list.textContent="Hakuna FREE booking codes kwa sasa.";

   return;
  }

  slips.forEach(slip=>{

   const card=document.createElement("div");
   card.className="slip";

   const title=document.createElement("h3");
   title.textContent=slip.title||"FREE BOOKING SLIP";

   const odds=document.createElement("p");
   odds.textContent="Total Odds: "+(slip.totalOdds??"Not set");

   const category=document.createElement("p");
   category.className="status";
   category.textContent="FREE";

   const kickoff=document.createElement("p");

   kickoff.textContent=slip.kickoffAt
    ?"Kick-Off: "+new Date(slip.kickoffAt).toLocaleString()
    :"Kick-Off: Not set";

   card.append(title,category,odds,kickoff);

   if(slip.isLocked){

    const locked=document.createElement("p");
    locked.className="lock-status";
    locked.textContent="🔒 BOOKING CODES LOCKED - KICK-OFF TIME REACHED";

    card.appendChild(locked);

   }else{

    const codes=slip.bookingCodes||[];

    if(!codes.length){

     const unavailable=document.createElement("p");
     unavailable.textContent="Booking codes hazipatikani kwa sasa.";

     card.appendChild(unavailable);

    }else{

     codes.forEach(item=>{

      const codeBox=document.createElement("div");
      codeBox.className="code";

      const bookmaker=document.createElement("strong");

      bookmaker.textContent=
       item.bookmaker==="SPORTYBET"||
       item.bookmaker==="SportyBet"
        ?"SPORTYBET"
        :"BETPAWA";

      const code=document.createElement("p");
      code.textContent=item.code;

      const copy=document.createElement("button");
      copy.textContent="COPY "+bookmaker.textContent+" CODE";

      copy.onclick=()=>copyCode(item.code,copy);

      codeBox.append(bookmaker,code,copy);

      card.appendChild(codeBox);

     });

     const available=document.createElement("p");
     available.className="status";
     available.textContent="FREE BOOKING CODES AVAILABLE";

     card.appendChild(available);

    }

   }

   if(slip.kickoffStartedAt&&!slip.isLocked){

    const note=document.createElement("p");
    note.className="small";
    note.textContent="Kick-Off countdown started.";

    card.appendChild(note);

   }

   list.appendChild(card);

  });

 }catch(error){

  list.textContent=error.message;

 }

}

/* COPY BOOKING CODE */

async function copyCode(code,button){

 try{

  await navigator.clipboard.writeText(code);

  button.textContent="COPIED!";

  setTimeout(()=>{
   button.textContent="COPY CODE";
  },2000);

 }catch(error){

  const input=document.createElement("textarea");

  input.value=code;
  document.body.appendChild(input);

  input.select();

  const copied=document.execCommand("copy");

  document.body.removeChild(input);

  button.textContent=copied?"COPIED!":"COPY FAILED";

 }

}

/* PREMIUM TIPS */

function showPremiumTips(tips){

 const list=document.getElementById("premiumTips");

 const premiumTips=tips.filter(
  tip=>tip.category==="PREMIUM"
 );

 list.innerHTML="";

 if(!premiumTips.length){

  list.textContent="Hakuna PREMIUM tips kwa sasa.";

  return;
 }

 premiumTips.forEach(tip=>{

  const card=document.createElement("div");
  card.className="slip locked";

  const label=document.createElement("p");
  label.className="lock-label";
  label.textContent="🔒 PREMIUM LOCKED";

  const match=document.createElement("h3");
  match.textContent=tip.matchName||"Premium Match";

  const info=document.createElement("p");
  info.textContent="This is an exclusive Premium tip.";

  const hidden=document.createElement("p");
  hidden.textContent="Prediction: 🔒 Hidden";

  const odds=document.createElement("p");
  odds.textContent="Odds: 🔒 Hidden";

  const button=document.createElement("button");
  button.textContent="PREMIUM ACCESS COMING SOON";
  button.disabled=true;

  card.append(
   label,
   match,
   info,
   hidden,
   odds,
   button
  );

  list.appendChild(card);

 });

}

/* FOLLOW AND UNFOLLOW */

async function changeFollow(isFollowing){

 try{

  const response=await fetch(
   API+"/api/follows/"+encodeURIComponent(tipsterId),
   {
    method:isFollowing?"DELETE":"POST",
    headers:{
     "Authorization":"Bearer "+token
    }
   }
  );

  let data={};

  try{
   data=await response.json();
  }catch{}

  if(!response.ok){
   throw new Error(data.error||"Follow action failed");
  }

  await loadProfile();

 }catch(error){

  alert(error.message);

 }

}

/* START */

loadProfile();

</script>

</body>
</html>
